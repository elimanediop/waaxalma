[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "waaxalma-backend"
version = "1.0.0"
description = "Waaxalma voice translation backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "python-multipart==0.0.20",
  "python-dotenv==1.1.0", "openai==1.78.1", "mutagen==1.47.0",
  "prometheus-client==0.21.1", "websockets==15.0.1", "pydantic==2.11.4", "pydantic-settings==2.9.1",
]

[project.scripts]
waaxalma-backend = "app.cli:main"
waaxalma-session-database = "scripts.session_database:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
