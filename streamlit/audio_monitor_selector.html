<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Waaxalma Local Monitor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: transparent;
        }

        .container {
            width: 100%;
            padding: 4px 2px 2px 2px;
        }

        .title {
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
        }

        .controls {
            display: grid;
            grid-template-columns:
                auto
                minmax(220px, 1fr)
                auto;
            gap: 8px;
            align-items: end;
        }

        .toggle {
            display: flex;
            align-items: center;
            gap: 7px;
            height: 36px;
            white-space: nowrap;
            font-size: 12px;
            font-weight: 600;
        }

        .toggle input {
            width: 16px;
            height: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
        }

        select,
        button {
            height: 36px;
            border:
                1px solid
                rgba(128, 128, 128, 0.35);
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
        }

        select {
            width: 100%;
            background: transparent;
            color: inherit;
        }

        button {
            cursor: pointer;
            font-weight: 600;
        }

        button:disabled,
        select:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .status {
            margin-top: 8px;
            font-size: 11px;
            line-height: 1.45;
            opacity: 0.75;
        }

        .status.warning {
            opacity: 1;
        }

        .capabilities {
            margin-top: 4px;
            font-size: 10px;
            opacity: 0.55;
        }

        @media (max-width: 680px) {
            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>

    __AUDIO_OUTPUT_MANAGER_SCRIPT__
</head>

<body>
<div class="container">

    <div class="title">
        🎧 Local Monitor
    </div>

    <div class="controls">

        <label class="toggle">
            <input
                id="monitorEnabled"
                type="checkbox"
            />
            Enable monitoring
        </label>

        <div class="field">
            <label for="monitorDevice">
                Monitor device
            </label>

            <select id="monitorDevice">
                <option value="">
                    Default audio output
                </option>
            </select>
        </div>

        <button id="refreshButton">
            Refresh
        </button>

    </div>

    <div
        id="status"
        class="status"
    >
        Discovering monitor outputs...
    </div>

    <div
        id="capabilities"
        class="capabilities"
    ></div>

</div>

<script>
    const MONITOR_DEVICE_STORAGE_KEY =
        "waaxalma.monitorOutputDeviceId";

    const MONITOR_ENABLED_STORAGE_KEY =
        "waaxalma.monitorEnabled";

    const PRIMARY_OUTPUT_STORAGE_KEY =
        "waaxalma.audioOutputDeviceId";


    const enabledElement =
        document.getElementById(
            "monitorEnabled"
        );

    const monitorDeviceElement =
        document.getElementById(
            "monitorDevice"
        );

    const refreshButton =
        document.getElementById(
            "refreshButton"
        );

    const statusElement =
        document.getElementById(
            "status"
        );

    const capabilitiesElement =
        document.getElementById(
            "capabilities"
        );


    function setStatus(
        message,
        isWarning = false
    ) {
        statusElement.textContent =
            message;

        statusElement.classList.toggle(
            "warning",
            isWarning
        );
    }


    function monitoringEnabled() {
        return (
            localStorage.getItem(
                MONITOR_ENABLED_STORAGE_KEY
            )
            === "true"
        );
    }


    function persistEnabled(
        enabled
    ) {
        localStorage.setItem(
            MONITOR_ENABLED_STORAGE_KEY,
            enabled
                ? "true"
                : "false"
        );
    }


    function renderCapabilities(
        capabilities
    ) {
        capabilitiesElement.textContent =
            (
                "enumerateDevices: "
                + (
                    capabilities.enumerateDevices
                    ? "yes"
                    : "no"
                )
                + " · setSinkId: "
                + (
                    capabilities.setSinkId
                    ? "yes"
                    : "no"
                )
            );
    }


    function normalizeDeviceLabel(
        device,
        index
    ) {
        if (
            device.deviceId
            === "default"
        ) {
            return (
                device.label
                || "Default audio output"
            );
        }

        return (
            device.label
            || (
                "Audio output "
                + String(index + 1)
            )
        );
    }


    function renderDevices(
        devices
    ) {
        const previousValue =
            monitorDeviceElement.value;

        monitorDeviceElement.innerHTML =
            "";

        const defaultOption =
            document.createElement(
                "option"
            );

        defaultOption.value =
            "";

        defaultOption.textContent =
            "Default audio output";

        monitorDeviceElement
            .appendChild(
                defaultOption
            );

        devices.forEach(
            (
                device,
                index
            ) => {
                if (
                    !device.deviceId
                    || device.deviceId
                    === "default"
                ) {
                    return;
                }

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    device.deviceId;

                option.textContent =
                    normalizeDeviceLabel(
                        device,
                        index
                    );

                monitorDeviceElement
                    .appendChild(
                        option
                    );
            }
        );

        const savedDeviceId =
            localStorage.getItem(
                MONITOR_DEVICE_STORAGE_KEY
            ) || "";

        const preferredValue =
            savedDeviceId
            || previousValue
            || "";

        const exists =
            preferredValue === ""
            || devices.some(
                device =>
                    device.deviceId
                    === preferredValue
            );

        monitorDeviceElement.value =
            exists
            ? preferredValue
            : "";

        if (!exists) {
            localStorage.removeItem(
                MONITOR_DEVICE_STORAGE_KEY
            );
        }
    }


    function renderState() {
        const enabled =
            monitoringEnabled();

        enabledElement.checked =
            enabled;

        monitorDeviceElement.disabled =
            !enabled;

        const monitorDeviceId =
            localStorage.getItem(
                MONITOR_DEVICE_STORAGE_KEY
            ) || "";

        const primaryDeviceId =
            localStorage.getItem(
                PRIMARY_OUTPUT_STORAGE_KEY
            ) || "";

        if (!enabled) {
            setStatus(
                (
                    "Local monitoring is disabled. "
                    + "Enable it to hear translated audio "
                    + "through a separate local device."
                )
            );

            return;
        }

        if (
            monitorDeviceId
            === primaryDeviceId
        ) {
            setStatus(
                (
                    "Monitor and primary output currently resolve "
                    + "to the same stored device. Select a headset "
                    + "for monitoring to avoid duplicate playback "
                    + "or feedback."
                ),
                true
            );

            return;
        }

        setStatus(
            (
                "Local monitoring is enabled. "
                + "Use headphones during conferencing "
                + "to avoid acoustic feedback."
            )
        );
    }


    const manager =
        new window
            .WaaxalmaAudioOutputManager({
                onDevicesChanged:
                    devices => {
                        renderDevices(
                            devices
                        );

                        renderState();
                    },

                onFallback:
                    () => {
                        localStorage.removeItem(
                            MONITOR_DEVICE_STORAGE_KEY
                        );

                        monitorDeviceElement.value =
                            "";

                        renderState();
                    },
            });


    async function refreshDevices() {
        refreshButton.disabled =
            true;

        try {
            const devices =
                await manager
                    .refreshDevices();

            renderDevices(
                devices
            );

            renderState();
        }
        catch (error) {
            console.error(
                "[LocalMonitor] refresh failed",
                error
            );

            setStatus(
                (
                    "Unable to enumerate monitor outputs: "
                    + error.message
                ),
                true
            );
        }
        finally {
            refreshButton.disabled =
                false;
        }
    }


    enabledElement.addEventListener(
        "change",
        () => {
            persistEnabled(
                enabledElement.checked
            );

            renderState();
        }
    );


    monitorDeviceElement
        .addEventListener(
            "change",
            async () => {
                const deviceId =
                    monitorDeviceElement.value;

                await manager
                    .setOutputDevice(
                        deviceId
                    );

                if (deviceId) {
                    localStorage.setItem(
                        MONITOR_DEVICE_STORAGE_KEY,
                        deviceId
                    );
                }
                else {
                    localStorage.removeItem(
                        MONITOR_DEVICE_STORAGE_KEY
                    );
                }

                renderState();
            }
        );


    refreshButton.addEventListener(
        "click",
        refreshDevices
    );


    window.addEventListener(
        "storage",
        event => {
            if (
                event.key
                === PRIMARY_OUTPUT_STORAGE_KEY
            ) {
                renderState();
            }
        }
    );


    window.addEventListener(
        "beforeunload",
        () => {
            manager.stop();
        }
    );


    async function initializeMonitorSelector() {
        renderCapabilities(
            manager.capabilities
        );

        try {
            await manager.start();

            await refreshDevices();

            renderState();
        }
        catch (error) {
            console.error(
                "[LocalMonitor] initialization failed",
                error
            );

            setStatus(
                (
                    "Local monitor discovery failed: "
                    + error.message
                ),
                true
            );
        }
    }


    initializeMonitorSelector();
</script>

</body>
</html>
