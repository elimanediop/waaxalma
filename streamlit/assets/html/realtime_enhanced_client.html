<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        Waaxalma Realtime Enhanced
    </title>

    __ASSET_CSS_realtime_enhanced_client.1.css__
</head>

<body>

<div class="container">

    <div class="controls">

        <div class="field">
            <label for="sourceLanguage">
                Source language
            </label>

            <select id="sourceLanguage">
                <option value="auto">
                    Auto
                </option>

                <option
                    value="fr"
                    selected
                >
                    French
                </option>

                <option value="en">
                    English
                </option>

                <option value="es">
                    Spanish
                </option>
            </select>
        </div>


        <div class="field">
            <label for="targetLanguage">
                Target language
            </label>

            <select id="targetLanguage">
                <option value="fr">
                    French
                </option>

                <option
                    value="en"
                    selected
                >
                    English
                </option>

                <option value="es">
                    Spanish
                </option>
            </select>
        </div>


        <div class="field">
            <label for="terminology">
                Terminology
            </label>

            <input
                id="terminology"
                type="text"
                placeholder="Waaxalma, Enhanced, Direct"
            />
        </div>

        <button id="startButton">
            Start
        </button>

        <button
            id="stopButton"
            disabled
        >
            Stop
        </button>

    </div>


    <div class="status-row">

        <div class="status">
            <span
                id="statusDot"
                class="status-dot"
            ></span>

            <span id="statusText">
                Stopped
            </span>
        </div>

        <span>
            Enhanced
        </span>

    </div>


    <div class="cards">

        <div class="card">

            <div class="card-title">
                Source transcript
            </div>

            <div
                id="sourceTranscript"
                class="transcript placeholder"
            >
                Start speaking to see the source transcript.
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Translation
            </div>

            <div
                id="translationTranscript"
                class="transcript placeholder"
            >
                Translation will appear here.
            </div>

        </div>

    </div>


    <div
        id="metrics"
        class="metrics"
    ></div>

</div>


__ASSET_JS_realtime_enhanced_client.1.js__

</body>
</html>
