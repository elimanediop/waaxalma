    <div class="title">
        🎤 Realtime Audio Input
    </div>

    <div class="controls">

        <div class="field">
            <label for="inputDevice">
                Input device
            </label>

            <select id="inputDevice">
                <option value="">
                    Default microphone
                </option>
            </select>
        </div>

        <button id="refreshButton">
            Refresh
        </button>

        <button id="permissionButton">
            Allow microphone access
        </button>

    </div>

    <div
        id="status"
        class="status"
    >
        Discovering microphones...
    </div>

    <div
        id="capabilities"
        class="capabilities"
    ></div>

</div>
