services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_OTEL: ${INSTALL_OTEL:-false}
    image: waaxalma-backend:1.0.0
    environment:
      APP_ENV: production
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-1.0}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-waaxalma}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      PROVIDER_TOKEN_PRICES_USD_PER_MILLION: ${PROVIDER_TOKEN_PRICES_USD_PER_MILLION:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      HOST: 0.0.0.0
      PORT: "8000"
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-30}
      SESSION_CLEANUP_ENABLED: ${SESSION_CLEANUP_ENABLED:-false}
      SESSION_CLEANUP_INTERVAL_SECONDS: ${SESSION_CLEANUP_INTERVAL_SECONDS:-3600}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-15}
      TELEMETRY_SHUTDOWN_TIMEOUT_SECONDS: ${TELEMETRY_SHUTDOWN_TIMEOUT_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_STORAGE_BACKEND: sqlite
      DATA_DIR: /var/lib/waaxalma
      STATIC_DIR: /var/lib/waaxalma/static
      UPLOAD_DIR: /var/lib/waaxalma/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8501","http://127.0.0.1:8501"]}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-openai}
      SPEECH_PROVIDER: ${SPEECH_PROVIDER:-openai}
      SPEECH_TO_TEXT_PROVIDER: ${SPEECH_TO_TEXT_PROVIDER:-openai}
      CONTEXT_PROVIDER: ${CONTEXT_PROVIDER:-passthrough}
      QUALITY_PROVIDER: ${QUALITY_PROVIDER:-deterministic}
      REALTIME_TRANSLATION_PROVIDER: ${REALTIME_TRANSLATION_PROVIDER:-openai}
      STREAMING_TRANSCRIPTION_PROVIDER: ${STREAMING_TRANSCRIPTION_PROVIDER:-openai}
      STREAMING_TRANSLATION_PROVIDER: ${STREAMING_TRANSLATION_PROVIDER:-openai}
      STREAMING_SPEECH_PROVIDER: ${STREAMING_SPEECH_PROVIDER:-openai}
      OPENAI_TRANSLATION_MODEL: ${OPENAI_TRANSLATION_MODEL:-gpt-4.1-mini}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-coral}
      SPEECH_VOICE: ${SPEECH_VOICE:-marin}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-transcribe}
      REALTIME_TRANSLATION_MODEL: ${REALTIME_TRANSLATION_MODEL:-gpt-realtime-translate}
      REALTIME_TRANSLATION_VOICE: ${REALTIME_TRANSLATION_VOICE:-marin}
      STREAMING_TRANSCRIPTION_MODEL: ${STREAMING_TRANSCRIPTION_MODEL:-gpt-live-transcribe}
      STREAMING_TRANSLATION_MODEL: ${STREAMING_TRANSLATION_MODEL:-}
      STREAMING_SPEECH_MODEL: ${STREAMING_SPEECH_MODEL:-}
      STREAMING_SPEECH_VOICE: ${STREAMING_SPEECH_VOICE:-}
      PROVIDER_MAX_ATTEMPTS: ${PROVIDER_MAX_ATTEMPTS:-3}
      PROVIDER_INITIAL_BACKOFF_SECONDS: ${PROVIDER_INITIAL_BACKOFF_SECONDS:-0.5}
      PROVIDER_BACKOFF_MULTIPLIER: ${PROVIDER_BACKOFF_MULTIPLIER:-2.0}
      PROVIDER_MAX_BACKOFF_SECONDS: ${PROVIDER_MAX_BACKOFF_SECONDS:-4.0}
      PROVIDER_JITTER_RATIO: ${PROVIDER_JITTER_RATIO:-0.2}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-30}
      TRANSLATION_TIMEOUT_SECONDS: ${TRANSLATION_TIMEOUT_SECONDS:-20}
      TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-30}
    ports:
      - ${BACKEND_PORT:-8000}:8000
    volumes:
      - waaxalma-data:/var/lib/waaxalma
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    restart: unless-stopped
    stop_grace_period: 30s

  ui:
    build:
      context: ./streamlit
    image: waaxalma-ui:1.0.0
    environment:
      APP_ENV: production
      BACKEND_API_URL: http://backend:8000
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:8000}
      CLIENT_ID: ${CLIENT_ID:-waaxalma-for-elimane}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-120}
    ports:
      - ${UI_PORT:-8501}:8501
    depends_on:
      backend:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    restart: unless-stopped
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:v3.7.1
    container_name: waaxalma-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - waaxalma-prometheus-data:/prometheus
    ports:
      - ${PROMETHEUS_PORT:-9090}:9090
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    container_name: waaxalma-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - waaxalma-grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - ${GRAFANA_PORT:-3000}:3000
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  waaxalma-data:
  waaxalma-prometheus-data:
  waaxalma-grafana-data:
